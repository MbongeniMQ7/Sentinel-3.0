<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f2a4a" />
    <title>Offline | SentinelAI Workforce</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 24px; background: #f8fafc; color: #0f2a4a; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; letter-spacing: 0; }
      main { width: 100%; max-width: 420px; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { margin: 24px 0 12px; font-size: 28px; line-height: 1.2; }
      p { margin: 0 0 28px; color: #526579; font-size: 16px; line-height: 1.6; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; border-radius: 6px; background: #0f2a4a; color: #fff; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #0284c7; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="SentinelAI" width="96" height="96" />
      <h1>You're offline</h1>
      <p>Attendance, alerts and live readings are unavailable. Reconnect to continue.</p>
      <a href="/login">Try again</a>
    </main>
  </body>
</html>
